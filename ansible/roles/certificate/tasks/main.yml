- tags:
    - certificate
    - letsencrypt
  vars:
    cert_directory: /etc/pki/acme
    acme_key: "{{ lookup('flowerysong.openbao.kv', 'certificate/letsencrypt', errors='ignore').rsa_key }}"
    cert_existing: "{{ lookup('flowerysong.openbao.kv', 'certificate/' ~ certificate, errors='ignore') }}"
    cert_subject_alt_names: "{{ [certificate] | union(certificate_sans | default([])) | map('regex_replace', '^', 'DNS:') }}"
  module_defaults:
    group/community.crypto.acme:
      # Need to have a default so that initial setup is possible;
      # module_defaults are evaluated even when they're not used...
      account_key_content: "{{ acme_key | default('placeholder') }}"
      acme_directory: https://acme-v02.api.letsencrypt.org/directory
      acme_version: 2
    community.crypto.acme_certificate:
      modify_account: false
      challenge: dns-01
    # Not part of the acme group, so the basic settings have to be repeated
    community.crypto.acme_certificate_renewal_info:
      acme_directory: https://acme-v02.api.letsencrypt.org/directory
      acme_version: 2
      ari_algorithm: start
      remaining_days: 20
  delegate_to: localhost
  run_once: true
  become: false
  block:
    - name: Create certificate storage directory
      ansible.builtin.file:
        dest: "{{ cert_directory }}"
        owner: "{{ lookup('env', 'USER') }}"
        mode: "0700"
        state: directory
      become: true

    - name: Create account key
      community.crypto.openssl_privatekey_pipe:
      register: result
      when: not (acme_key | default(false))
      no_log: true

    - name: Store account key
      flowerysong.openbao.kv:
        token: "{{ ansible_openbao_token }}"
        key: certificate/letsencrypt
        value:
          rsa_key: "{{ result.privatekey }}"
      when: result is not skipped
      no_log: true

    - name: Register ACME account
      community.crypto.acme_account:
        state: present
        account_key_content: "{{ acme_key }}"
        terms_agreed: true
        contact:
          - mailto:letsencrypt@devnull.mail.umich.edu
      when: result is not skipped

    - name: Copy existing certificates for {{ certificate }}
      ansible.builtin.copy:
        dest: "{{ cert_directory }}/{{ certificate }}.{{ item }}.crt"
        content: "{{ cert_existing[item ~ '_cert'] | default('') }}"
        mode: "0755"
      when:
        - cert_existing[item ~ '_cert'] | default('') | length > 0
        - (cert_existing[item ~ '_cert'] | community.crypto.x509_certificate_info).subject_alt_name | ansible.builtin.symmetric_difference(cert_subject_alt_names) | length == 0
      loop:
        - rsa
        - ecc
      register: result

    - name: Delete stale certificates for {{ certificate }}
      ansible.builtin.file:
        dest: "{{ cert_directory }}/{{ certificate }}.{{ item }}.crt"
        state: absent
      loop: "{{ result.results | select('skipped') | map(attribute='item') }}"

    - name: Check whether the certificate is due for renewal
      community.crypto.acme_certificate_renewal_info:
        certificate_path: "{{ cert_directory }}/{{ certificate }}.{{ item }}.crt"
      failed_when: false
      changed_when: acme_renewal_due.should_renew | default(true)
      loop:
        - rsa
        - ecc
      register: acme_renewal_due

    - ansible.builtin.include_tasks:
        file: order.yml
      loop: "{{ acme_renewal_due.results | select('changed') | map(attribute='item') }}"
      loop_control:
        loop_var: cert_type


- tags:
    - certificate
  vars:
    cert_data: "{{ lookup('flowerysong.hvault.kv', 'certificate/' ~ certificate) }}"
  block:
    - name: "{{ certificate }} : Get private key info"
      community.crypto.openssl_privatekey_info:
        content: "{{ cert_data[item ~ '_key'] }}"
      loop:
        - rsa
        - ecc
      register: cert_key_info

    - name: "{{ certificate }} : Get certificate info"
      community.crypto.x509_certificate_info:
        content: "{{ cert_data[item ~ '_cert'] }}"
      loop:
        - rsa
        - ecc
      register: cert_crt_info

    - ansible.builtin.assert:
        that:
          - cert_key_info.results.0.public_key_fingerprints.sha512 == cert_crt_info.results.0.public_key_fingerprints.sha512
          - cert_key_info.results.1.public_key_fingerprints.sha512 == cert_crt_info.results.1.public_key_fingerprints.sha512

    - name: Install chain verification tool
      ansible.builtin.copy:
        dest: /usr/local/bin/cert-chain-verify
        src: cert-chain-verify
        owner: root
        group: root
        mode: "0755"

    - name: Create certificate storage directory
      ansible.builtin.file:
        dest: /etc/pki/collab/private
        owner: root
        group: mail
        mode: "0750"
        state: directory

    - name: "{{ certificate }} : Install private keys"
      ansible.builtin.copy:
        dest: /etc/pki/collab/private/{{ certificate }}.{{ item }}.key
        content: "{{ cert_data[item ~ '_key'] }}"
        owner: root
        group: mail
        mode: "0640"
      no_log: true
      loop:
        - rsa
        - ecc
      register: result_key

    - name: "{{ certificate }} : Install certificates"
      ansible.builtin.copy:
        dest: /etc/pki/collab/private/{{ certificate }}.{{ item }}.crt
        content: "{{ cert_data[item ~ '_cert'] }}"
        owner: root
        group: mail
        mode: "0644"
        validate: cert-chain-verify %s
      loop:
        - rsa
        - ecc
      register: result_cert

    - name: Restart dependent services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      when: "[result_key, result_cert] | select('changed')"
      loop: "{{ certificate_services | default([]) }}"
